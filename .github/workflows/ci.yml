name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'release/**'
      - 'feature/prometheus-catalogue-proposal'
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e '.[dev,browser]'
          python -m playwright install --with-deps chromium

      - name: Static and unit checks
        run: |
          python -m compileall -q src tests
          pytest -q -rs
          node --check ui/app.js

      - name: Build wheel
        run: |
          python -m build --wheel
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1

      - name: Verify wheel plugin resources
        run: |
          python - <<'PY'
          import glob
          import json
          import zipfile

          wheels = glob.glob('dist/*.whl')
          assert len(wheels) == 1, wheels

          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
              manifest_path = next(
                  n
                  for n in names
                  if 'share/openhop/plugins/openhop.prometheus/openhop-plugin.json' in n
              )
              next(n for n in names if 'share/openhop/plugins/openhop.prometheus/config.default.json' in n)
              next(n for n in names if 'share/openhop/plugins/openhop.prometheus/ui/index.html' in n)
              next(n for n in names if 'share/openhop/plugins/openhop.prometheus/ui/app.js' in n)
              next(n for n in names if 'share/openhop/plugins/openhop.prometheus/ui/styles.css' in n)
              for asset in ('prometheus-logo.svg', 'PROMETHEUS-LICENSE', 'PROVENANCE.md'):
                  next(n for n in names if n.endswith('/ui/assets/' + asset))

              manifest = json.loads(zf.read(manifest_path))
              assert manifest['schema'] == 1
              assert manifest['id'] == 'openhop.prometheus'
              assert manifest['runtime'] == {'type': 'python', 'entrypoint': 'openhop-prometheus'}
              assert manifest['ui'] == {'type': 'application', 'entry': 'ui/index.html'}

          print('verified', wheels[0])
          PY
      - name: Smoke-test installed wheel outside source tree
        run: |
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/prometheus-wheel.XXXXXX")"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install dist/*.whl
          (cd "$smoke_dir" &&
            "$smoke_dir/venv/bin/openhop-prometheus" --version &&
            "$smoke_dir/venv/bin/openhop-prometheus" --help > /dev/null)