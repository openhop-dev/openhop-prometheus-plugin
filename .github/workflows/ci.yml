name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e '.[dev,browser]'
          python -m playwright install --with-deps chromium

      - name: Static and unit checks
        run: |
          python -m compileall -q src tests
          pytest -q -rs
          node --check ui/app.js

      - name: Build wheel
        run: |
          python -m build --wheel
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1

      - name: Verify wheel plugin resources
        run: |
          python - <<'PY'
          import glob
          import json
          import zipfile

          wheels = glob.glob('dist/*.whl')
          assert len(wheels) == 1, wheels

          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
              manifest_path = next(
                  n
                  for n in names
                  if 'share/openhop/plugins/openhop.prometheus/openhop-plugin.json' in n
              )
              next(n for n in names if 'share/openhop/plugins/openhop.prometheus/config.default.json' in n)
              next(n for n in names if 'share/openhop/plugins/openhop.prometheus/ui/index.html' in n)
              next(n for n in names if 'share/openhop/plugins/openhop.prometheus/ui/app.js' in n)
              next(n for n in names if 'share/openhop/plugins/openhop.prometheus/ui/styles.css' in n)

              manifest = json.loads(zf.read(manifest_path))
              assert manifest['schema'] == 1
              assert manifest['id'] == 'openhop.prometheus'
              assert manifest['runtime'] == {'type': 'python', 'entrypoint': 'openhop-prometheus'}
              assert manifest['ui'] == {'type': 'application', 'entry': 'ui/index.html'}

          print('verified', wheels[0])
          PY